<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Project 300K">
<title>Project 300K Version 1.0</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--good:#047857;--bad:#b91c1c;--warn:#b45309;--radius:22px}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
header{padding:max(22px,env(safe-area-inset-top)) 18px 16px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-end}
h1,h2,h3,p{margin-top:0}.eyebrow{margin-bottom:5px;font-size:12px;letter-spacing:.18em;color:var(--muted);font-weight:800}
.badge{padding:7px 10px;border-radius:999px;background:#eef2ff;font-size:12px;font-weight:800}
main{max-width:920px;margin:auto;padding:16px}
.hero{background:linear-gradient(145deg,#111827,#374151);color:white;border-radius:28px;padding:22px;display:flex;justify-content:space-between;gap:16px;align-items:end}
.hero-value{font-size:38px;font-weight:900;margin:8px 0 4px}.muted{color:var(--muted)}.small{font-size:12px}
.primary{border:0;border-radius:14px;padding:13px 16px;font-weight:800;background:#111827;color:white}.primary.light{background:white;color:#111827}.wide{width:100%}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.metric b{display:block;font-size:22px;margin-top:6px}.metric{min-height:94px}
.section{margin-top:14px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.upload{border:2px dashed #cbd5e1;border-radius:18px;padding:18px;text-align:center;background:#f8fafc}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:white;margin-top:7px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0}
table{width:100%;border-collapse:collapse;min-width:760px;font-size:13px}.table-wrap{overflow:auto}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.mark{font-size:20px;font-weight:900}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.report-block{padding:14px 0;border-top:1px solid var(--line)}.report-block:first-child{border-top:0}
.ticket{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:13px}
.race-item{padding:14px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.race-item:first-child{border-top:0}.pill{font-size:11px;background:#f3f4f6;padding:5px 8px;border-radius:999px}
.hidden{display:none!important}
dialog{border:0;border-radius:24px 24px 0 0;width:min(100%,760px);margin:auto auto 0;padding:0;max-height:90vh}
dialog::backdrop{background:rgba(17,24,39,.45)}dialog form{padding:20px;max-height:90vh;overflow:auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:none;font-size:28px;color:var(--muted)}
@media(max-width:560px){.grid{grid-template-columns:1fr 1fr}.hero{flex-direction:column;align-items:stretch}.hero .primary{width:100%}}
</style>
</head>
<body>
<header>
<div><p class="eyebrow">PROJECT 300K</p><h1>予想レポート・検証管理</h1></div>
<div class="badge">Version 1.0</div>
</header>
<main>
<section class="hero">
<div><p class="small" style="opacity:.75">今月の検証収支</p><p class="hero-value" id="profit">¥0</p><p class="small" id="recovery" style="opacity:.75">回収率 0.0%</p></div>
<button class="primary light" id="newRaceBtn">＋ レース登録</button>
</section>

<section class="grid">
<div class="card metric"><span class="small muted">登録レース</span><b id="raceCount">0</b></div>
<div class="card metric"><span class="small muted">未反省</span><b id="pendingCount">0</b></div>
<div class="card metric"><span class="small muted">展開データ待ち</span><b id="waitingCount">0</b></div>
<div class="card metric"><span class="small muted">P95以上</span><b id="p95Count">0</b></div>
</section>

<section class="card section">
<div class="section-head"><h2>CSVからP基準レポート作成</h2><span class="small muted">Ver.0.2形式対応</span></div>
<div class="upload">
<strong>CSVファイルを選択</strong>
<p class="small muted">UTF-8／Shift-JISを簡易判定します。</p>
<input type="file" id="csvFile" accept=".csv,text/csv">
</div>
</section>

<section id="reportSection" class="card section hidden">
<div class="section-head"><h2>P基準による予想</h2><span id="raceJudge" class="pill"></span></div>
<div class="grid">
<div class="card metric"><span class="small muted">本命候補</span><b id="topHorse">-</b></div>
<div class="card metric"><span class="small muted">P評価</span><b id="topP">-</b></div>
<div class="card metric"><span class="small muted">危険度</span><b id="topDanger">-</b></div>
<div class="card metric"><span class="small muted">使用予定額</span><b id="usableBudget">¥0</b></div>
</div>

<div class="report-block">
<h3>レース全体コメント</h3>
<p id="raceComment"></p>
</div>

<div class="report-block">
<h3>本命コメント</h3>
<p id="mainComment"></p>
</div>

<div class="report-block">
<h3>危険馬</h3>
<p id="dangerComment"></p>
</div>

<div class="report-block">
<h3>自動買い目・資金配分</h3>
<div id="betList"></div>
</div>

<div class="report-block">
<h3>評価一覧</h3>
<div class="table-wrap">
<table>
<thead><tr><th>印</th><th>順位</th><th>馬番</th><th>馬名</th><th>P評価</th><th>Pスコア</th><th>信頼度</th><th>危険度</th><th>人気</th><th>コメント</th></tr></thead>
<tbody id="horseRows"></tbody>
</table>
</div>
</div>

<button class="primary wide" id="savePredictionBtn">この予想を最新レースへ保存</button>
</section>

<section class="card section">
<div class="section-head"><h2>最近のレース</h2><button id="clearBtn" style="border:0;background:none;color:var(--muted)">全削除</button></div>
<div id="raceList"></div>
<p id="empty" class="muted" style="text-align:center;padding:20px 0 6px">まだ登録がありません。</p>
</section>
</main>

<dialog id="raceDialog">
<form id="raceForm" method="dialog">
<div class="sheet-head"><h2>レース登録</h2><button type="button" class="close" onclick="raceDialog.close()" aria-label="閉じる">×</button>
<label>日付<input type="date" id="raceDate" required></label>
<label>競馬場<input id="venue" placeholder="例：大井" required></label>
<label>レース番号<input type="number" id="raceNo" min="1" max="12" required></label>
<label>基本予算（円）<input type="number" id="budget" value="10000" min="1000" step="100" required></label>
<label>区分<select id="raceType"><option>検証</option><option>勝負</option><option>見送り候補</option></select></label>
<label>メモ<textarea id="memo" rows="3"></textarea></label>
<button class="primary wide" value="default">登録</button>
</form>
</dialog>

<script>
const KEY="project300k_v1";let db=load();let current=null;
const yen=new Intl.NumberFormat("ja-JP",{style:"currency",currency:"JPY",maximumFractionDigits:0});
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{races:[]}}catch{return{races:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));renderDashboard()}
function t(v){return(v??"").toString().replace(/\u3000/g," ").replace(/\s+/g," ").trim()}
function n(v,d=0){const m=t(v).match(/-?\d+(?:\.\d+)?/);return m?Number(m[0]):d}
function pick(r,keys,d=""){for(const k of keys)if(t(r[k])!=="")return r[k];return d}
function parseLine(line,delim){let out=[],cur="",q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===delim&&!q){out.push(cur);cur=""}else cur+=ch}out.push(cur);return out}
function parseCSV(str){const lines=str.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n").filter(x=>x.trim());if(!lines.length)throw Error("CSVが空です");
const d=lines[0].split("\t").length>lines[0].split(",").length?"\t":",";const h=parseLine(lines[0],d).map(x=>t(x.replace(/^\uFEFF/,"")));
return lines.slice(1).map(line=>{const c=parseLine(line,d),r={};h.forEach((x,i)=>r[x]=c[i]??"");return r})}
async function readSmart(file){const b=await file.arrayBuffer();let s=new TextDecoder("utf-8").decode(b);if((s.match(/�/g)||[]).length>2)try{s=new TextDecoder("shift-jis").decode(b)}catch{}return s}
function normalize(rows){return rows.filter(r=>t(r["馬名"])||n(pick(r,["馬番","馬番号"],999),999)!==999).map((r,i)=>({
raw:r,index:i,name:t(r["馬名"]).replace(/データベース/g,""),number:n(pick(r,["馬番","馬番号"],999),999),
rating:n(pick(r,["オッズ抜きP評価","P評価","P基準"],55),55),score:n(pick(r,["オッズ抜きPスコア","Pスコア","総合スコア"],0),0),
danger:n(pick(r,["危険度点","危険スコア","危険度スコア"],60),60),confidence:t(pick(r,["本命信頼度","信頼度"],"C")).toUpperCase(),
popularity:n(pick(r,["人気","単勝人気"],999),999),rank:n(pick(r,["オッズ抜き順位","順位"],999),999)
}))}
function sortH(h){return [...h].sort((a,b)=>(a.rank-b.rank)||(b.score-a.score)||(b.rating-a.rating)||(a.danger-b.danger))}
function judge(h){const s=sortH(h),a=s[0],b=s[1],gap=b?a.score-b.score:0;if(!a)return{label:"見送り",rate:0,reason:"データ不足"};
if(a.danger>=70||a.confidence==="D"||a.rating<80)return{label:"見送り",rate:0,reason:"本命候補の信頼性不足",top:a,gap};
if(a.rating>=95&&a.confidence==="A"&&a.danger<=35&&gap>=4)return{label:"勝負",rate:1,reason:"P95以上・信頼度A・危険度低",top:a,gap};
if(a.rating>=90&&["A","B"].includes(a.confidence)&&a.danger<=50)return{label:"準勝負",rate:.8,reason:"P90以上で安定",top:a,gap};
if(a.rating>=85&&a.danger<=60)return{label:"通常",rate:.6,reason:"上位評価だが決め手は中程度",top:a,gap};
return{label:"検証",rate:.4,reason:"買えるが検証優先",top:a,gap}}
function commentHorse(x,rank){let parts=[];if(x.rating>=95)parts.push("P評価が非常に高い");else if(x.rating>=90)parts.push("P評価は上位");else if(x.rating>=85)parts.push("P評価は合格圏");
if(x.confidence==="A")parts.push("信頼度A");else if(x.confidence==="B")parts.push("信頼度B");
if(x.danger<=35)parts.push("危険度が低い");else if(x.danger>=70)parts.push("危険度が高い");
if(x.popularity<=3)parts.push("上位人気");else if(x.popularity>=6&&x.rating>=85)parts.push("人気以上の評価");
return parts.length?parts.join("・")+"。":`${rank}番手評価。`}
function buildBets(h,j,budget){if(j.rate===0)return{usable:0,items:[]};const s=sortH(h),axis=s[0].number,opp=s.slice(1,5).map(x=>x.number).filter(x=>x!==999);
let combos=[];opp.slice(0,3).forEach(x=>combos.push({type:"ワイド",combo:[axis,x]}));opp.slice(0,2).forEach(x=>combos.push({type:"馬連",combo:[axis,x]}));
for(let i=0;i<Math.min(3,opp.length);i++)for(let k=i+1;k<Math.min(4,opp.length);k++)combos.push({type:"三連複",combo:[axis,opp[i],opp[k]].sort((a,b)=>a-b)});
if(["勝負","準勝負"].includes(j.label)&&opp.length>=2)combos.push({type:"三連単",combo:[axis,opp[0],opp[1]]});
const usable=Math.floor((budget*j.rate)/100)*100,each=Math.max(100,Math.floor((usable/combos.length)/100)*100);combos.forEach(x=>x.amount=each);
let total=combos.reduce((s,x)=>s+x.amount,0);if(combos[0]&&usable>total)combos[0].amount+=usable-total;return{usable,items:combos}}
function renderReport(h,budget){const s=sortH(h);s.forEach((x,i)=>x.mark=["◎","○","▲","△","☆"][i]||"");const j=judge(s),bets=buildBets(s,j,budget);
current={horses:s,judge:j,bets,budget};
reportSection.classList.remove("hidden");raceJudge.textContent=j.label;raceJudge.className="pill "+(j.label==="見送り"?"bad":j.label==="勝負"?"good":"warn");
topHorse.textContent=j.top?`${j.top.number}番 ${j.top.name}`:"-";topP.textContent=j.top?`P${j.top.rating}`:"-";topDanger.textContent=j.top?`${j.top.danger}点`:"-";usableBudget.textContent=yen.format(bets.usable);
raceComment.textContent=`${j.label}判定。${j.reason}。上位差は${j.gap?.toFixed?j.gap.toFixed(2):0}ポイント。`;
mainComment.textContent=j.top?`◎ ${j.top.number}番 ${j.top.name}。${commentHorse(j.top,1)}`:"本命候補なし。";
const danger=s.filter(x=>x.danger>=70||x.confidence==="D").slice(0,3);
dangerComment.textContent=danger.length?danger.map(x=>`${x.number}番 ${x.name}（危険度${x.danger}点・信頼度${x.confidence}）`).join("／"):"明確な危険馬は見当たりません。";
horseRows.innerHTML=s.map((x,i)=>`<tr><td class="mark">${x.mark}</td><td>${i+1}</td><td>${x.number===999?"-":x.number}</td><td>${x.name}</td><td>P${x.rating}</td><td>${x.score.toFixed(2)}</td><td>${x.confidence}</td><td>${x.danger}点</td><td>${x.popularity===999?"-":x.popularity}</td><td>${commentHorse(x,i+1)}</td></tr>`).join("");
if(!bets.items.length)betList.innerHTML='<p class="muted">今回は見送りです。</p>';else betList.innerHTML=bets.items.map(x=>`<div class="ticket"><span>${x.type} ${x.combo.join("-")}</span><strong>${yen.format(x.amount)}</strong></div>`).join("");
reportSection.scrollIntoView({behavior:"smooth"})}
csvFile.addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{const rows=parseCSV(await readSmart(f)),h=normalize(rows);if(!h.length)throw Error("馬データが見つかりません");const budget=db.races.at(-1)?.budget||10000;renderReport(h,budget)}catch(err){alert("CSV読み込みエラー：\n"+err.message)}})
function renderDashboard(){raceList.innerHTML="";[...db.races].reverse().forEach(r=>{const profit=(r.payout||0)-(r.stake||0);const el=document.createElement("div");el.className="race-item";
el.innerHTML=`<div><strong>${r.date} ${r.venue}${r.raceNo}R</strong><p class="small muted">${r.raceType}・予算 ${yen.format(r.budget||0)}・${r.judge||"予想未保存"}</p></div><div style="text-align:right"><span class="pill">${r.reviewStatus||"未反省"}</span><p class="${profit>=0?"good":"bad"}"><strong>${profit>0?"+":""}${yen.format(profit)}</strong></p></div>`;raceList.appendChild(el)});
empty.classList.toggle("hidden",db.races.length>0);raceCount.textContent=db.races.length;pendingCount.textContent=db.races.filter(r=>(r.reviewStatus||"未反省")==="未反省").length;
waitingCount.textContent=db.races.filter(r=>r.reviewStatus==="展開データ待ち").length;p95Count.textContent=db.races.filter(r=>(r.topP||0)>=95).length;
const st=db.races.reduce((s,r)=>s+(r.stake||0),0),pa=db.races.reduce((s,r)=>s+(r.payout||0),0),pr=pa-st;profit.textContent=`${pr>0?"+":""}${yen.format(pr)}`;recovery.textContent=`回収率 ${st?(pa/st*100).toFixed(1):"0.0"}%`}
newRaceBtn.onclick=()=>{raceDate.value=new Date().toISOString().slice(0,10);raceDialog.showModal()}
raceForm.addEventListener("submit",e=>{e.preventDefault();db.races.push({id:String(Date.now()),date:raceDate.value,venue:venue.value.trim(),raceNo:Number(raceNo.value),budget:Number(budget.value),raceType:raceType.value,memo:memo.value.trim(),reviewStatus:"未反省",stake:0,payout:0});save();e.target.reset();raceDialog.close()})
savePredictionBtn.onclick=()=>{if(!current)return;if(!db.races.length)return alert("先にレースを登録してください");const r=db.races.at(-1);r.judge=current.judge.label;r.topHorse=current.judge.top?`${current.judge.top.number}番 ${current.judge.top.name}`:"";r.topP=current.judge.top?.rating||0;r.prediction=current;save();alert("最新レースへ予想を保存しました")}
clearBtn.onclick=()=>{if(confirm("すべての登録データを削除しますか？")){db={races:[]};localStorage.removeItem(KEY);renderDashboard()}}
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));
renderDashboard();
</script>
</body>
</html>
